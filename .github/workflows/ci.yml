name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./backend
      run: npm ci
    
    - name: Generate Prisma Client
      working-directory: ./backend
      run: npx prisma generate
    
    - name: Run database migrations
      working-directory: ./backend
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: file:./test.db
    
    - name: Lint check
      working-directory: ./backend
      run: npm run lint || echo "No lint script configured"
    
    - name: Start backend server
      working-directory: ./backend
      run: |
        npm start &
        sleep 5
      env:
        DATABASE_URL: file:./test.db
        APP_PORT: 4000
        JWT_SECRET: test-secret
    
    - name: Health check
      run: curl -f http://localhost:4000/health || curl -f http://localhost:4000/ || exit 0

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    
    - name: Install dependencies
      working-directory: ./web
      run: npm ci
    
    - name: Build Next.js app
      working-directory: ./web
      run: npm run build
      env:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
    
    - name: Lint check
      working-directory: ./web
      run: npm run lint || echo "No lint script configured"

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build backend image
      run: docker build -f Dockerfile.backend -t xeno-backend:test .
    
    - name: Build web image
      run: docker build -f Dockerfile.web -t xeno-web:test .
    
    - name: Test docker-compose
      run: docker-compose config

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run npm audit (backend)
      working-directory: ./backend
      run: npm audit --audit-level=high || true
    
    - name: Run npm audit (frontend)
      working-directory: ./web
      run: npm audit --audit-level=high || true
